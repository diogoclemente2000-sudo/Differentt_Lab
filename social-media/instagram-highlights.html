<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@200;300;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  background:#111;
  padding:60px 40px;
  display:flex;
  gap:32px;
  align-items:flex-start;
  flex-wrap:wrap;
}
.label{
  width:1080px;
  font-family:'Overpass',sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:rgba(255,255,255,.2);
  padding-bottom:14px;
  border-bottom:1px solid rgba(255,255,255,.06);
  margin-bottom:0;
}
.row{display:flex;gap:32px;flex-wrap:wrap;width:100%;}
.col{display:flex;flex-direction:column;gap:12px;align-items:center;}
.col-label{
  font-family:'Overpass',sans-serif;
  font-size:10px;
  font-weight:700;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:rgba(255,255,255,.2);
}
/* ── Highlight slide: 1080×1920 ── */
.hl{
  width:1080px;
  height:1920px;
  background:#000;
  position:relative;
  overflow:hidden;
  flex-shrink:0;
}
/* ── Preview crop circle (shown beside) ── */
.hl-preview{
  width:240px;
  height:240px;
  border-radius:50%;
  overflow:hidden;
  flex-shrink:0;
  border:3px solid rgba(255,255,255,.08);
  position:relative;
}
.hl-preview-inner{
  width:240px;
  height:426px; /* 240 * (1920/1080) */
  position:absolute;
  top:50%;
  left:0;
  transform:translateY(-50%);
}
/* shared layers */
.noise{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.055;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px;}
.inner{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:52px;}
.cat{
  font-family:'Overpass',sans-serif;
  font-size:52px;
  font-weight:700;
  letter-spacing:.32em;
  text-transform:uppercase;
  color:rgba(255,255,255,.35);
}
</style>
</head>
