<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#111;display:flex;flex-wrap:wrap;gap:48px;padding:60px;align-items:flex-start;}
.slide{width:1080px;height:1920px;position:relative;overflow:hidden;flex-shrink:0;background:#000;}
.label{font-family:sans-serif;font-size:13px;color:#555;margin-bottom:10px;letter-spacing:.05em;}
.wrap{display:flex;flex-direction:column;}
</style>
</head>
<body>

<div class="wrap">
<div class="label">1v2 — Diogo Vieira</div>
<div class="slide" id="s2-diogo">
  <div style="position:absolute;inset:-30px;
    background:url('../Website_photos/photos_us_page/DiogoVieira.jpg') center top/cover no-repeat;
    filter:grayscale(100%) blur(12px) brightness(.75);z-index:0;"></div>
  <div style="position:absolute;inset:0;background:rgba(4,2,10,.70);z-index:1;"></div>
  <svg style="position:absolute;inset:0;width:100%;height:100%;opacity:.04;pointer-events:none;z-index:2;" xmlns="http://www.w3.org/2000/svg">
    <filter id="gr1"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#gr1)"/>
  </svg>
</div>
</div>
