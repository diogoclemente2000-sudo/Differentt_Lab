<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@200;300;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  background:#111;
  display:flex;
  flex-wrap:wrap;
  gap:48px;
  padding:60px;
  align-items:flex-start;
}
.slide{
  width:1080px;
  height:1920px;
  position:relative;
  overflow:hidden;
  flex-shrink:0;
  background:#000;
}
.label{font-family:sans-serif;font-size:13px;color:#555;margin-bottom:10px;letter-spacing:.05em;}
.wrap{display:flex;flex-direction:column;}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════ -->
<!-- POST 1 — DIOGO VIEIRA · Founder                      -->
<!-- Gradiente de baixo                                    -->
<!-- ══════════════════════════════════════════════════════ -->
<div class="wrap">
<div class="label">1 — Diogo Vieira · Founder</div>
<div class="slide" id="s-diogo">

  <!-- Photo B&W -->
  <div style="position:absolute;inset:0;
    background:url('../Website_photos/photos_us_page/DiogoVieira.jpg') center top/cover no-repeat;
    filter:grayscale(100%) contrast(1.12) brightness(.92);
    z-index:0;"></div>

  <!-- Grain -->
  <svg style="position:absolute;inset:0;width:100%;height:100%;opacity:.04;pointer-events:none;z-index:1;" xmlns="http://www.w3.org/2000/svg">
    <filter id="gr1"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#gr1)"/>
  </svg>

  <!-- Bottom gradient -->
  <div style="position:absolute;inset:0;
    background:linear-gradient(to top,
      rgba(4,2,10,.99) 0%,
      rgba(4,2,10,.94) 18%,
      rgba(90,40,130,.16) 42%,
      transparent 65%);
    z-index:2;pointer-events:none;"></div>

  <!-- Logo top-right -->
  <div style="position:absolute;top:80px;right:80px;z-index:5;pointer-events:none;">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 71.18 71.18" width="52" height="52">
      <path fill="rgba(255,255,255,0.48)" d="m71.18,53.05v-17.59L35.73,0h-.27L0,35.45v17.86l22.33-22.33,4.46,4.46h0S0,62.25,0,62.25v8.93h8.93l26.8-26.79,26.8,26.79h8.66v-8.93l-26.66-26.66,4.6-4.6,22.06,22.06Zm-30.99-30.99l-4.6,4.6-4.47-4.47,4.6-4.6,4.47,4.47Z"/>
    </svg>
  </div>

  <!-- Role -->
  <div style="position:absolute;bottom:440px;left:80px;z-index:5;">
    <span style="font-family:'Overpass',sans-serif;font-size:16px;font-weight:300;letter-spacing:.55em;text-transform:uppercase;color:rgba(255,255,255,.38);">Founder</span>
  </div>
  <!-- Separator -->
  <div style="position:absolute;bottom:410px;left:80px;width:52px;height:1px;background:rgba(158,123,182,.55);z-index:5;"></div>

  <!-- First name -->
  <div style="position:absolute;bottom:180px;left:72px;z-index:5;">
    <div style="font-family:'Overpass',sans-serif;font-size:220px;font-weight:900;letter-spacing:-.03em;color:rgba(255,255,255,.90);line-height:.86;">DIOGO</div>
  </div>
  <!-- Last name -->
  <div style="position:absolute;bottom:100px;left:80px;z-index:5;">
    <div style="font-family:'Overpass',sans-serif;font-size:85px;font-weight:200;letter-spacing:.16em;color:rgba(255,255,255,.36);">VIEIRA</div>
  </div>

</div>
</div>

  <!-- Logo bottom-right -->
  <div style="position:absolute;bottom:80px;right:80px;z-index:5;pointer-events:none;">

      <path fill="rgba(255,255,255,0.48)" d="m71.18,53.05v-17.59L35.73,0h-.27L0,35.45v17.86l22.33-22.33,4.46,4.46h0S0,62.25,0,62.25v8.93h8.93l26.8-26.79,26.8,26.79h8.66v-8.93l-26.66-26.66,4.6-4.6,22.06,22.06Zm-30.99-30.99l-4.6,4.6-4.47-4.47,4.6-4.6,4.47,4.47Z"/>
    </svg>
  </div>

  <!-- Left text — vertically centered -->
  <div style="position:absolute;top:50%;left:80px;transform:translateY(-50%);z-index:5;">
    <!-- Role -->
    <div style="font-family:'Overpass',sans-serif;font-size:16px;font-weight:300;letter-spacing:.55em;text-transform:uppercase;color:rgba(255,255,255,.38);margin-bottom:30px;">3D Artist</div>
    <!-- Separator -->
    <div style="width:52px;height:1px;background:rgba(158,123,182,.55);margin-bottom:30px;"></div>
    <!-- Name -->
    <div style="font-family:'Overpass',sans-serif;font-size:220px;font-weight:900;letter-spacing:-.03em;color:rgba(255,255,255,.90);line-height:.86;">MARTA</div>
    <div style="font-family:'Overpass',sans-serif;font-size:85px;font-weight:200;letter-spacing:.16em;color:rgba(255,255,255,.36);margin-top:8px;">FERNANDES</div>
  </div>

</div>
</div>
