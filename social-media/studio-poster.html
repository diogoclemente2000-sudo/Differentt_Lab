<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@200;300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  background:#0d0d0d;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:60px;
}
.slide{
  width:1080px;
  height:1920px;
  background:#000;
  position:relative;
  overflow:hidden;
  flex-shrink:0;
}
</style>
</head>
<body>

<div class="slide" id="poster">

  <!-- ── BACKGROUND LAYERS ── -->

  <!-- Deep vignette -->
  <div style="
    position:absolute;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(ellipse 120% 70% at 50% 50%,
      transparent 30%,
      rgba(0,0,0,.55) 70%,
      rgba(0,0,0,.9) 100%);
  "></div>

  <!-- Central purple atmospheric glow -->
  <div style="
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:900px;height:900px;
    background:radial-gradient(ellipse,
      rgba(120,80,160,.13) 0%,
      rgba(100,60,140,.06) 35%,
      transparent 70%);
    pointer-events:none;z-index:1;
  "></div>

  <!-- Inner tight glow -->
  <div style="
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:420px;height:420px;
    background:radial-gradient(ellipse,
      rgba(158,123,182,.1) 0%,
      transparent 70%);
    pointer-events:none;z-index:1;
  "></div>

  <!-- Bottom radial glow -->
  <div style="
    position:absolute;
    bottom:-200px;left:50%;
    transform:translateX(-50%);
    width:900px;height:700px;
    background:radial-gradient(ellipse,
      rgba(120,80,160,.18) 0%,
      rgba(100,60,140,.08) 40%,
      transparent 70%);
    pointer-events:none;z-index:1;
    filter:blur(8px);
  "></div>

  <!-- Grain/noise texture -->
  <svg style="position:absolute;inset:0;width:100%;height:100%;opacity:.04;pointer-events:none;z-index:2;" xmlns="http://www.w3.org/2000/svg">
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#grain)"/>
  </svg>

  <!-- ── LEFT LOGO — oversized, cropped, ultra faint ── -->
  <div style="
    position:absolute;
    top:50%;
    left:-790px;
    transform:translateY(-50%);
    z-index:3;
    pointer-events:none;
    filter:
      drop-shadow(0 0 60px rgba(130,80,180,.35))
      drop-shadow(0 0 180px rgba(110,60,160,.18));
    opacity:.9;
  ">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 71.18 71.18" width="1080" height="1080">
      <path
        fill="none"
        stroke="rgba(158,123,182,0.18)"
        stroke-width="0.55"
        stroke-linejoin="round"
        d="m71.18,53.05v-17.59L35.73,0h-.27L0,35.45v17.86l22.33-22.33,4.46,4.46h0S0,62.25,0,62.25v8.93h8.93l26.8-26.79,26.8,26.79h8.66v-8.93l-26.66-26.66,4.6-4.6,22.06,22.06Zm-30.99-30.99l-4.6,4.6-4.47-4.47,4.6-4.6,4.47,4.47Z"
      />
    </svg>
  </div>

  <!-- ── RIGHT LOGO — oversized, cropped, ultra faint ── -->
  <div style="
    position:absolute;
    top:50%;
    right:-790px;
    transform:translateY(-50%);
    z-index:3;
    pointer-events:none;
    filter:
      drop-shadow(0 0 60px rgba(130,80,180,.35))
      drop-shadow(0 0 180px rgba(110,60,160,.18));
    opacity:.9;
  ">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 71.18 71.18" width="1080" height="1080">
      <path
        fill="none"
        stroke="rgba(158,123,182,0.18)"
        stroke-width="0.55"
        stroke-linejoin="round"
        d="m71.18,53.05v-17.59L35.73,0h-.27L0,35.45v17.86l22.33-22.33,4.46,4.46h0S0,62.25,0,62.25v8.93h8.93l26.8-26.79,26.8,26.79h8.66v-8.93l-26.66-26.66,4.6-4.6,22.06,22.06Zm-30.99-30.99l-4.6,4.6-4.47-4.47,4.6-4.6,4.47,4.47Z"
      />
    </svg>
  </div>

  <!-- ── CENTER LOGO — sharp, clean, principal ── -->
  <div style="
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    z-index:4;
    pointer-events:none;
    filter:
      drop-shadow(0 0 8px rgba(255,255,255,.12))
      drop-shadow(0 0 32px rgba(158,123,182,.45))
      drop-shadow(0 0 80px rgba(120,80,160,.25));
  ">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 71.18 71.18" width="340" height="340">
      <path
        fill="none"
        stroke="rgba(255,255,255,0.82)"
        stroke-width="1.1"
        stroke-linejoin="round"
        d="m71.18,53.05v-17.59L35.73,0h-.27L0,35.45v17.86l22.33-22.33,4.46,4.46h0S0,62.25,0,62.25v8.93h8.93l26.8-26.79,26.8,26.79h8.66v-8.93l-26.66-26.66,4.6-4.6,22.06,22.06Zm-30.99-30.99l-4.6,4.6-4.47-4.47,4.6-4.6,4.47,4.47Z"
      />
    </svg>
  </div>

  <!-- ── TYPOGRAPHY — STUDIO ── -->
  <div style="
    position:absolute;
    bottom:148px;
    left:0;right:0;
    z-index:5;
    display:flex;
    justify-content:center;
    pointer-events:none;
  ">
    <span style="
      font-family:'Overpass',sans-serif;
      font-size:22px;
      font-weight:200;
      letter-spacing:.9em;
      text-transform:uppercase;
      color:rgba(255,255,255,.28);
      text-indent:.9em;
    ">Studio</span>
  </div>

  <!-- ── top vignette fade ── -->
  <div style="
    position:absolute;top:0;left:0;right:0;height:320px;
    background:linear-gradient(180deg,rgba(0,0,0,.7) 0%,transparent 100%);
    z-index:6;pointer-events:none;
  "></div>
  <!-- ── bottom vignette fade ── -->
  <div style="
    position:absolute;bottom:0;left:0;right:0;height:320px;
    background:linear-gradient(0deg,rgba(0,0,0,.7) 0%,transparent 100%);
    z-index:6;pointer-events:none;
  "></div>

</div>

</body>
</html>
